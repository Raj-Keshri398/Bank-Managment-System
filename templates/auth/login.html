{% extends "base.html" %}

{% block title %}Login | Bank Management System{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to access your bank dashboard.</p>

  <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      placeholder="Enter your username"
      value="{{ username or '' }}"
      required
      autofocus
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      required
    />

    <button type="submit">Login</button>
  </form>

  <p class="auth-footer">
    Don’t have an account?
    <a href="{{ url_for('auth.register') }}">Create one</a>
  </p>
</section>
{% endblock %}
