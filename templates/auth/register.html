{% extends "base.html" %}

{% block title %}Register | Bank Management System{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Create Account</h1>
  <p class="subtitle">Register to start managing your banking activities.</p>

  <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      placeholder="Choose a username"
      value="{{ form_data.username if form_data else '' }}"
      required
      autofocus
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="Enter your email"
      value="{{ form_data.email if form_data else '' }}"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Minimum 6 characters"
      minlength="6"
      required
    />

    <button type="submit">Register</button>
  </form>

  <p class="auth-footer">
    Already have an account?
    <a href="{{ url_for('auth.login') }}">Login</a>
  </p>
</section>
{% endblock %}
